<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dark-lord helmet mark">
  <defs>
    <radialGradient id="field" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#1c1416"/>
      <stop offset="0.6" stop-color="#100c0e"/>
      <stop offset="1" stop-color="#070506"/>
    </radialGradient>
    <linearGradient id="shell" x1="256" y1="96" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a3034"/>
      <stop offset="0.3" stop-color="#161113"/>
      <stop offset="0.72" stop-color="#0a0708"/>
      <stop offset="1" stop-color="#14080a"/>
    </linearGradient>
    <linearGradient id="plate" x1="256" y1="150" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#221a1c"/>
      <stop offset="1" stop-color="#060405"/>
    </linearGradient>
    <radialGradient id="visor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6466"/>
      <stop offset="0.55" stop-color="#e23234"/>
      <stop offset="1" stop-color="#7c1518"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- field -->
  <circle cx="256" cy="256" r="246" fill="url(#field)"/>
  <circle cx="256" cy="256" r="245" stroke="#e23234" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="256" cy="256" r="232" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- ambient crimson glow behind the helmet -->
  <circle cx="256" cy="250" r="120" fill="#e23234" opacity="0.12" filter="url(#glow)"/>

  <!-- helmet shell -->
  <path d="M256 96C210 96 172 120 150 166C134 200 128 240 134 282C140 326 160 368 196 398C216 415 236 424 256 428C276 424 296 415 316 398C352 368 372 326 378 282C384 240 378 200 362 166C340 120 302 96 256 96Z" fill="url(#shell)"/>

  <!-- inner face plate -->
  <path d="M256 138C220 138 190 158 172 196C158 226 154 258 160 292C166 330 184 364 214 388C228 399 242 406 256 409C270 406 284 399 298 388C328 364 346 330 352 292C358 258 354 226 340 196C322 158 292 138 256 138Z" fill="url(#plate)"/>

  <!-- brow / dome highlight -->
  <path d="M163 175C185 130 216 108 256 108C296 108 327 130 349 175" stroke="#5a4a4e" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 110V404" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- center ridge -->
  <path d="M242 150H270L276 214H236L242 150Z" fill="#2a2024"/>
  <path d="M250 150H262L266 214H246L250 150Z" fill="#0a0708"/>

  <!-- crimson visor / eyes -->
  <g filter="url(#glow)">
    <path d="M168 210L232 230L226 260L166 244Z" fill="url(#visor)"/>
    <path d="M344 210L280 230L286 260L346 244Z" fill="url(#visor)"/>
  </g>
  <path d="M178 218L224 232L221 250L177 238Z" fill="#ffd9d9" opacity="0.65"/>
  <path d="M334 218L288 232L291 250L335 238Z" fill="#ffd9d9" opacity="0.65"/>

  <!-- nose bridge -->
  <path d="M244 250H268L274 300L256 312L238 300L244 250Z" fill="#17080a"/>
  <path d="M250 256H262L266 298L256 306L246 298L250 256Z" fill="#060405"/>

  <!-- mouth grille (triangular vent) -->
  <path d="M214 312H298L284 360L256 378L228 360L214 312Z" fill="#1a1416"/>
  <path d="M226 322H286" stroke="#050304" stroke-width="8" stroke-linecap="round"/>
  <path d="M232 340H280" stroke="#050304" stroke-width="7" stroke-linecap="round"/>
  <path d="M242 356H270" stroke="#050304" stroke-width="6" stroke-linecap="round"/>

  <!-- side vents -->
  <path d="M150 250C150 212 159 178 178 150" stroke="#241a1c" stroke-width="9" stroke-linecap="round"/>
  <path d="M362 250C362 212 353 178 334 150" stroke="#241a1c" stroke-width="9" stroke-linecap="round"/>
</svg>
